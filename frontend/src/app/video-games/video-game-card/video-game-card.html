<mat-card appearance="outlined">
  <!-- The API stores an IGDB image id, not a URL, so the size is chosen here
       at render time. Still null for games added by hand or with no IGDB
       match, hence the placeholder. -->
  @if (coverUrl(game().cover_image_id); as cover) {
    <img mat-card-image [src]="cover" [alt]="game().title + ' cover art'" />
  } @else {
    <div class="cover-placeholder" aria-hidden="true">
      <mat-icon>videogame_asset</mat-icon>
    </div>
  }

  <mat-card-header>
    <mat-card-title>{{ game().title }}</mat-card-title>
    <mat-card-subtitle>{{ game().platform }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-actions>
    <mat-chip-set>
      <mat-chip [class]="'status-' + game().status">{{ statusLabels[game().status] }}</mat-chip>
    </mat-chip-set>
    <span class="spacer"></span>
    <button
      mat-icon-button
      type="button"
      matTooltip="Delete game"
      [disabled]="deleting()"
      (click)="deleteGame()"
      aria-label="Delete game"
    >
      <mat-icon>delete</mat-icon>
    </button>
    <a mat-icon-button [routerLink]="['/video-games', game().id, 'edit']" aria-label="Edit game">
      <mat-icon>edit</mat-icon>
    </a>
  </mat-card-actions>

  @if (deleteError()) {
    <p class="delete-error" role="alert">Couldn't delete this game. Try again.</p>
  }
</mat-card>
