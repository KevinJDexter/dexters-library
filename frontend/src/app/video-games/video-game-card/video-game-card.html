<mat-card appearance="outlined">
  @if (game().coverUrl; as cover) {
    <img mat-card-image [src]="cover" [alt]="game().title + ' cover art'" />
  } @else {
    <!-- Placeholder until a metadata API supplies real cover art. -->
    <div class="cover-placeholder" aria-hidden="true">
      <mat-icon>videogame_asset</mat-icon>
    </div>
  }

  <mat-card-header>
    <mat-card-title>{{ game().title }}</mat-card-title>
    <mat-card-subtitle>{{ game().platform }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-actions>
    <mat-chip-set>
      <mat-chip [class]="'status-' + game().status">{{ game().status }}</mat-chip>
    </mat-chip-set>
    <span class="spacer"></span>
    <a mat-icon-button [routerLink]="['/video-games', game().id, 'edit']" aria-label="Edit game">
      <mat-icon>edit</mat-icon>
    </a>
  </mat-card-actions>
</mat-card>
