<mat-toolbar class="shell-toolbar">
  <span class="brand">🎮 Dexter's Library</span>
  <span class="spacer"></span>
  <!-- One nav link per collection; Board Games and friends slot in beside
       Video Games when they exist. -->
  <a mat-button routerLink="/video-games" routerLinkActive="active">Video Games</a>
  <a mat-button routerLink="/stats" routerLinkActive="active">Stats</a>
</mat-toolbar>

<main>
  <router-outlet />
</main>

<footer class="api-status" aria-live="polite">
  @if (health.isLoading()) {
    Checking the backend&hellip;
  } @else if (health.error()) {
    Can't reach the API — is <code>uvicorn</code> running on port 8000?
  } @else {
    API: {{ health.value()?.message }}
  }
</footer>
