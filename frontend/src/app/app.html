<main>
  <h1>Dexter's Library</h1>
  <p class="subtitle">A tracker for my own game collection and achievements.</p>

  <section class="status" aria-live="polite">
    @if (health.isLoading()) {
      <p>Checking the backend&hellip;</p>
    } @else if (health.error()) {
      <p class="bad">
        Can't reach the API. Is <code>uvicorn</code> running on port 8000?
      </p>
    } @else {
      <p class="good">API says: {{ health.value()?.message }}</p>
    }
  </section>
</main>

<router-outlet />
